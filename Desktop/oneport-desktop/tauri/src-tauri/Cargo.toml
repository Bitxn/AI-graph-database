[package]
name = "oneport-desktop"
version = "0.1.0"
description = "OnePort — Security Cockpit"
authors = ["OnePort"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"
wait-timeout = "0.2"

[[bin]]
name = "oneport-desktop"
path = "src/main.rs"

# Small, stripped release binary — on-brand for a security tool (tiny surface).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
